name: Smacktechnologies
description: Smack Technologies is a frontier AI lab dedicated to national security, building
  domain-specific multimodal models trained via deep reinforcement learning in synthetic warfare
  environments to deliver decision dominance to the U.S. Department of War, its allies and partners.
  The company ships two product suites — Omega, a command-level AI stack pairing frontier models
  with customer-specific applications for strategic decision-making, and Alpha, an edge-level stack
  of lightweight models on proprietary hardware for tactical platforms and autonomous systems.
  Founded by MARSOC veterans Andrew Markoff and Clint Alanis and headquartered in El Segundo,
  California, Smack has raised $32M across Seed and Series A rounds led by Felicis. As of this
  enrichment pass the company publishes no public API, developer portal, or SDKs — a defense-domain
  vendor with no external developer surface.
